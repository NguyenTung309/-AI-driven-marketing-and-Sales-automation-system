services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clawbot-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clawbot-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clawbot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clawbot-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Self-host metasearch cho agent web.search (khong can API key). JSON API bat qua searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: clawbot-searxng
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: clawbot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: clawbot-metabase-postgres
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_PASSWORD:?METABASE_PASSWORD is required}
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: clawbot-metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_PASSWORD:?METABASE_PASSWORD is required}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  clawbot-api:
    build:
      context: ..
      dockerfile: src/api/Clawbot.Api/Dockerfile
    container_name: clawbot-api
    ports:
      - "127.0.0.1:15874:15874"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:15874
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=clawbot;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMq=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - Vector__Qdrant__Host=qdrant
      # Shared cryptographic settings. Development defaults only; override both outside local use.
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      - Encryption__Base64Key=${ENCRYPTION_BASE64_KEY:?ENCRYPTION_BASE64_KEY is required}
      # Pancake tokens - doc tu file .env (cung thu muc)
      - PANCAKE_ACCESS_TOKEN=${PANCAKE_ACCESS_TOKEN:-}
      - PANCAKE_PAGE_ACCESS_TOKEN=${PANCAKE_PAGE_ACCESS_TOKEN:-}
      - PANCAKE_PAGE_ID=${PANCAKE_PAGE_ID:-}
      - Meta__Graph__AppId=${Meta__Graph__AppId:-}
      - Meta__Graph__AppSecret=${Meta__Graph__AppSecret:-}
      - Meta__Graph__ConfigurationId=${Meta__Graph__ConfigurationId:-}
      - Meta__Graph__AuthorizationMode=${Meta__Graph__AuthorizationMode:-business_system_user}
      - Meta__Graph__WebhookVerifyToken=${Meta__Graph__WebhookVerifyToken:-}
      - Meta__Graph__RedirectUri=${Meta__Graph__RedirectUri:-}
      - Meta__Graph__FrontendReturnUrl=${Meta__Graph__FrontendReturnUrl:-}
      - Meta__Graph__ApiVersion=${Meta__Graph__ApiVersion:-v25.0}
      - Ads__Meta__Enabled=${Ads__Meta__Enabled:-false}
      - Ads__Meta__WebhookSecret=${Ads__Meta__WebhookSecret:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15874/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  clawbot-gateway:
    build:
      context: ..
      dockerfile: src/gateway/Clawbot.Gateway/Dockerfile
    container_name: clawbot-gateway
    ports:
      - "127.0.0.1:15873:15873"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:15873
      # No fallback secret: an unset value must fail HMAC checks, not silently accept a published default.
      - Gateway__Pancake__WebhookSecret=${PANCAKE_WEBHOOK_SECRET:-}
      # Must match clawbot-api's Jwt__SigningKey so the gateway can verify forwarded tokens.
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      # Pancake tokens - doc tu file .env (cung thu muc)
      - PANCAKE_ACCESS_TOKEN=${PANCAKE_ACCESS_TOKEN:-}
      - PANCAKE_PAGE_ACCESS_TOKEN=${PANCAKE_PAGE_ACCESS_TOKEN:-}
      - PANCAKE_PAGE_ID=${PANCAKE_PAGE_ID:-}
      - ReverseProxy__Clusters__backend__Destinations__backend/primary__Address=http://clawbot-api:15874
    depends_on:
      - clawbot-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15873/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlserver_data:
  qdrant_data:
  minio_data:
  metabase_postgres_data:

