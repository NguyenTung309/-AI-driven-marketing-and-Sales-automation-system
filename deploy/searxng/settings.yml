# SearXNG cho Clawbot web.search tool. use_default_settings giu nguyen engine mac dinh,
# chi bat JSON API va tat limiter (chay noi bo, khong expose ra ngoai).
use_default_settings: true
server:
  secret_key: "local-development-searxng-secret"
  limiter: false
search:
  formats:
    - html
    - json
