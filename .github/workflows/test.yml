name: CI — Build + Test + Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/clawbot-web/package-lock.json

      - name: Restore
        run: dotnet restore Clawbot.sln

      - name: Build
        run: dotnet build Clawbot.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Clawbot.sln --no-build --configuration Release

      - name: Frontend Install
        working-directory: src/frontend/clawbot-web
        run: npm ci

      - name: Frontend Lint
        working-directory: src/frontend/clawbot-web
        run: npm run lint

      - name: Frontend Build
        working-directory: src/frontend/clawbot-web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: src/frontend/clawbot-web
        run: npx playwright install --with-deps chromium

      - name: Frontend Platform and Instagram E2E
        working-directory: src/frontend/clawbot-web
        run: |
          npm run preview -- --host 127.0.0.1 --port 15876 --strictPort > platform-focus-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:15876/login > /dev/null; then
              npm run test:e2e:platform && npm run test:e2e:instagram && npm run test:e2e:post-performance
              exit $?
            fi
            sleep 1
          done
          cat platform-focus-vite.log
          exit 1

      - name: Migration Static Guard
        shell: pwsh
        run: ./deploy/ci/verify-migrations.ps1

      - name: Identity DDL Preflight
        shell: pwsh
        run: ./deploy/ci/verify-identity-ddl.ps1

      - name: Production Deployment Contracts
        shell: bash
        run: |
          pwsh -NoProfile -File ./deploy/ci/verify-production-deployment.ps1
          sh -n deploy/production/*.sh deploy/ci/test-production-deployment.sh
          sh deploy/ci/test-production-deployment.sh

      - name: KB Seed Authoring Smoke Test
        shell: pwsh
        run: ./deploy/seed/generate-kb-seed.ps1 -SmokeTest

      - name: Pancake Ops Script Dry Run
        shell: pwsh
        env:
          PANCAKE_BASE_URL: https://pancake.vn/api/v1
          PANCAKE_ACCESS_TOKEN: dry-run-access-token
          PANCAKE_PAGE_ID: dry-run-page
          PANCAKE_TENANT_SLUG: hoc-ba
          CLAWBOT_PUBLIC_BASE_URL: https://api.example.test
          PANCAKE_WEBHOOK_SECRET: dry-run-webhook-secret
          PANCAKE_WEBHOOK_PAYLOAD: '{"type":"COMMENT","message":"dry run","post_id":"post-1","comment_id":"comment-1"}'
        run: |
          ./deploy/pancake-webhook-subscribe.ps1 -DryRun
          ./deploy/pancake-webhook-replay.ps1 -DryRun

      - name: Go-live Readiness Report
        shell: pwsh
        run: ./deploy/ci/verify-go-live-readiness.ps1 -ReportOnly -SkipDockerProbe

