name: CI — Build + Test + Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Clawbot.sln

      - name: Build
        run: dotnet build Clawbot.sln --no-restore --configuration Release

      - name: Unit Tests (no Docker)
        run: >
          dotnet test Clawbot.sln
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~Integration"
          --logger "trx;LogFileName=unit-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Integration Tests (Testcontainers)
        run: >
          dotnet test tests/Clawbot.Integration.Tests/Clawbot.Integration.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 30

      - name: Coverage Report Summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool || true
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:MarkdownSummaryGithub" \
            || echo "Coverage report generation skipped"
          if [ -f CoverageReport/SummaryGithub.md ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi
