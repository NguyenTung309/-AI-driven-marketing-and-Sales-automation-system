syntax = "proto3";

option csharp_namespace = "Clawbot.Agents.Contracts.Orchestrator";

package clawbot.agents.orchestrator;

import "google/protobuf/timestamp.proto";

service Orchestrator {
  // Legacy keyword planner. Deprecated: no server implementation or caller remains (see V2 lifecycle below).
  // Field numbers kept reserved for wire compatibility; do not reuse.
  rpc Plan (PlanRequest) returns (PlanResponse) {
    option deprecated = true;
  }
  rpc Trace (TraceRequest) returns (stream TraceEvent) {
    option deprecated = true;
  }

  // Dynamic agent orchestration lifecycle.
  rpc Submit (SubmitRequest) returns (SessionResponse);
  rpc GetPlan (SessionRef) returns (SessionResponse);
  rpc UpdatePlan (UpdatePlanRequest) returns (SessionResponse);
  rpc Approve (SessionRef) returns (SessionResponse);
  rpc Control (ControlRequest) returns (SessionResponse);
  // Human-in-the-loop recovery on a paused run: edit a task's output, retry it, or skip it and
  // continue downstream — no planner call, so a single failed task no longer costs a full re-plan.
  rpc InterveneTask (InterveneTaskRequest) returns (SessionResponse);
  // Starts a persisted automatic schedule immediately without moving its cadence window to now.
  rpc RunSchedule (RunScheduleRequest) returns (RunScheduleResponse);
}

message PlanRequest {
  option deprecated = true;
  string tenant_id = 1;
  string goal = 2;
  google.protobuf.Timestamp requested_at = 3;
}

message PlanResponse {
  option deprecated = true;
  string session_id = 1;
  repeated PlannedTask tasks = 2;
}

message PlannedTask {
  string id = 1;
  string agent = 2;
  string description = 3;
  repeated string depends_on = 4;
  string status = 5;
  string output = 6;
  string error = 7;
  string input_json = 8;
}

message TraceRequest {
  option deprecated = true;
  string session_id = 1;
  string tenant_id = 2;
}

message TraceEvent {
  option deprecated = true;
  string task_id = 1;
  string phase = 2;
  string message = 3;
  google.protobuf.Timestamp at = 4;
  string agent_name = 5;
}

// --- Dynamic orchestration lifecycle messages ---

message SubmitRequest {
  string tenant_id = 1;
  string goal = 2;
  google.protobuf.Timestamp requested_at = 3;
  // SPEC-16 P3-3: the user initiating the run, so the session (and terminal notifications) can be attributed to them.
  string user_id = 4;
  // Dry-run: plan + walk the DAG but tools only return "[dry-run] would ..." previews (no real side effects).
  bool dry_run = 5;
}

message SessionRef {
  string tenant_id = 1;
  string session_id = 2;
  string expected_etag = 3;
}

message UpdatePlanRequest {
  string tenant_id = 1;
  string session_id = 2;
  string plan_json = 3;
  string expected_etag = 4;
}

message ControlRequest {
  string tenant_id = 1;
  string session_id = 2;
  string action = 3; // pause | resume | cancel
  string expected_etag = 4;
}

message InterveneTaskRequest {
  string tenant_id = 1;
  string session_id = 2;
  string task_id = 3;
  string action = 4;         // edit_output | retry | skip
  string output = 5;         // edit_output: the corrected output handed to dependents
  bool rerun_downstream = 6; // reset already-finished dependents so the edit actually propagates
  string expected_etag = 7;
  string user_id = 8;        // audit + execution principal for the edited plan
}

message RunScheduleRequest {
  string tenant_id = 1;
  string schedule_id = 2;
  string user_id = 3;
}

message RunScheduleResponse {
  // started | skipped_overlap | not_found
  string status = 1;
  string session_id = 2;
  google.protobuf.Timestamp next_run_at = 3;
  google.protobuf.Timestamp last_run_at = 4;
  // Durable AgentScheduleRun identity. Present only when the manual request started a run.
  string run_id = 5;
}

message SessionResponse {
  string session_id = 1;
  string status = 2;
  bool requires_approval = 3;
  string goal = 4;
  repeated PlannedTask tasks = 5;
  bool cost_blocked = 6;
  string cost_reason = 7;
  int32 replan_count = 8;
  string etag = 9;
  string plan_json = 10;
}
