syntax = "proto3";

option csharp_namespace = "Clawbot.Agents.Contracts.Ads";

package clawbot.agents.ads;

service AdsAgent {
  rpc Evaluate (AdsEvaluateRequest) returns (AdsEvaluateResponse);
  rpc BuildLookalike (AdsLookalikeRequest) returns (AdsLookalikeResponse);
  rpc Remarket (AdsRemarketRequest) returns (AdsRemarketResponse);
  rpc HandleSignal (AdsSignalRequest) returns (AdsSignalResponse);
}

message AdsEvaluateRequest {
  string tenant_id = 1;
  string platform = 2;            // meta|tiktok
  string campaign_id = 3;
}

message AdsEvaluateResponse {
  repeated AdsActionExecuted actions = 1;
}

message AdsActionExecuted {
  string rule_id = 1;
  string action_taken = 2;        // pause|scale_up|scale_down|alert
  string note = 3;
}

message AdsLookalikeRequest {
  string tenant_id = 1;
  string platform = 2;
  repeated string seed_contact_keys = 3;
}

message AdsLookalikeResponse {
  string audience_id = 1;
  bool created = 2;
  string error = 3;
}

message AdsRemarketRequest {
  string tenant_id = 1;
  string platform = 2;
  string audience_name = 3;
  repeated string contact_keys = 4;
}

message AdsRemarketResponse {
  bool success = 1;
  string error = 2;
}

message AdsSignalRequest {
  string tenant_id = 1;
  string vendor = 2;              // meta|tiktok
  string signal_type = 3;         // budget_threshold|spark_trigger
  string campaign_id = 4;
  string payload_json = 5;
}

message AdsSignalResponse {
  bool handled = 1;
  string action_taken = 2;
  string error = 3;
}
