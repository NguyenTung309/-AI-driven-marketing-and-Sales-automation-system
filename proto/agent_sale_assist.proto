syntax = "proto3";

option csharp_namespace = "Clawbot.Agents.Contracts.SaleAssist";

package clawbot.agents.sale_assist;

service SaleAssistAgent {
  rpc Draft (DraftRequest) returns (DraftResponse);
  rpc Summarize (SummarizeRequest) returns (SummarizeResponse);
  rpc AutoSummaryOnResolve (AutoSummaryRequest) returns (AutoSummaryResponse);
  rpc Upsell (UpsellRequest) returns (UpsellResponse);
}

message DraftRequest {
  string tenant_id = 1;
  string conversation_id = 2;
  string sale_user_id = 3;
}

message DraftResponse {
  string draft_text = 1;
  string suggested_action = 2;
  int32 lead_score = 3;
}

message SummarizeRequest {
  string tenant_id = 1;
  string conversation_id = 2;
}

message SummarizeResponse {
  string summary = 1;
}

message AutoSummaryRequest {
  string tenant_id = 1;
  string conversation_id = 2;
}

message AutoSummaryResponse {
  string summary = 1;
  repeated string key_points = 2;
  bool persisted = 3;
}

// SaleAssist-4: contextual upsell suggestion for a near-closing (hot) lead.
message UpsellRequest {
  string tenant_id = 1;
  string conversation_id = 2;
}

message UpsellResponse {
  bool eligible = 1;       // false when the lead is not yet 'hot' (no LLM call made)
  string suggestion = 2;   // AI-generated upsell text (empty when not eligible)
  string reason = 3;       // why eligible / not eligible
  int32 lead_score = 4;
}
