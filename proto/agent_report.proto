syntax = "proto3";

option csharp_namespace = "Clawbot.Agents.Contracts.Report";

package clawbot.agents.report;

service ReportAgent {
  rpc DailySnapshot (DailySnapshotRequest) returns (DailySnapshotResponse);
  rpc Forecast (ForecastRequest) returns (ForecastResponse);
  rpc DetectAnomaly (DetectAnomalyRequest) returns (DetectAnomalyResponse);
}

message DailySnapshotRequest {
  string tenant_id = 1;
  string date = 2;                 // YYYY-MM-DD GMT+7
}

message DailySnapshotResponse {
  repeated PlatformKpi rows = 1;
}

message PlatformKpi {
  string platform = 1;
  int32 leads = 2;
  int32 dms = 3;
  int32 replies = 4;
  int32 conversions = 5;
  double avg_response_time_sec = 6;
  double ad_spend = 7;
}

message ForecastRequest {
  string tenant_id = 1;
  string platform = 2;
  string metric = 3;
  int32 horizon_days = 4;
}

message ForecastResponse {
  repeated ForecastPointDto points = 1;
}

message ForecastPointDto {
  string date = 1;                 // YYYY-MM-DD
  double value = 2;
  double lower_bound = 3;
  double upper_bound = 4;
}

message DetectAnomalyRequest {
  string tenant_id = 1;
  string platform = 2;
  string metric = 3;
  double z_threshold = 4;
  int32 lookback_days = 5;
}

message DetectAnomalyResponse {
  repeated AnomalyPointDto points = 1;
}

message AnomalyPointDto {
  string date = 1;                 // YYYY-MM-DD
  double value = 2;
  double z_score = 3;
  bool is_anomaly = 4;
}
