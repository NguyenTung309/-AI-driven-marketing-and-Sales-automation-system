syntax = "proto3";

option csharp_namespace = "Clawbot.Agents.Contracts.Content";

package clawbot.agents.content;

service ContentAgent {
  rpc Generate (ContentRequest) returns (ContentResponse);
  rpc Repurpose (RepurposeRequest) returns (ContentResponse);
  // Review-gate P1: reviewer-agent chấm một content item; verdict=approve thì stamp ApprovedByAgentId,
  // reject thì demote kèm lý do, needs_human giữ nguyên chờ người (fail-closed).
  rpc Review (ReviewContentRequest) returns (ReviewContentResponse);
}

message ContentRequest {
  string tenant_id = 1;
  string brief = 2;
  string channel = 3;
  string brief_id = 4;
}

message ContentResponse {
  string content_id = 1;
  string title = 2;
  string body = 3;
  repeated ContentVariant variants = 4;
}

message ContentVariant {
  string platform = 1;
  string title = 2;
  string body = 3;
  string content_id = 4;
}

message RepurposeRequest {
  string tenant_id = 1;
  string content_id = 2;
  repeated string target_channels = 3;
  string source_body = 4;
}

message ReviewContentRequest {
  string tenant_id = 1;
  string content_id = 2;
}

message ReviewContentResponse {
  string verdict = 1; // approve | reject | needs_human
  string reason = 2;
  string reviewed_by_agent_definition_id = 3; // set khi verdict=approve
}
